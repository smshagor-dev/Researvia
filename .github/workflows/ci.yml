name: CI

on:
  push:
    branches: [main, full-platform-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/researvia_ci
          SESSION_SECRET: ci-session-secret-value-at-least-32-characters
          TOKEN_ENCRYPTION_KEY: ci-token-encryption-value-at-least-32-chars
          APP_URL: http://localhost:3000
        run: npm run build
